<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="1">
        <animate attributeName="stop-color" values="#FF3366;#FF9900;#FF3366" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="1">
        <animate attributeName="stop-color" values="#7C4DFF;#00CCFF;#7C4DFF" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Filters for glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Animation paths -->
    <path id="orbit" d="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
  </defs>
  
  <!-- Background circles -->
  <g class="background">
    <circle cx="150" cy="150" r="110" fill="none" stroke="url(#mainGradient)" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="100;110;100" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="150" r="90" fill="none" stroke="url(#mainGradient)" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="85;90;85" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Main "boom" symbol -->
  <g class="boom-symbol" filter="url(#glow)">
    <!-- Central Star -->
    <path d="M150,150 l25,-10 l-10,25 l25,5 l-25,10 l10,25 l-25,-5 l-10,25 l-5,-25 l-25,10 l10,-25 l-25,-5 l25,-10 l-10,-25 l25,5 z" fill="url(#mainGradient)">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="20s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" />
    </path>
    
    <!-- Orbit Elements -->
    <g class="orbiting-elements">
      <!-- 8 Small squares that orbit -->
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      </rect>
      
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" begin="0.625s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="5s" repeatCount="indefinite" />
      </rect>
      
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" begin="1.25s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="5s" repeatCount="indefinite" />
      </rect>
      
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" begin="1.875s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="135" to="495" dur="5s" repeatCount="indefinite" />
      </rect>
      
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="5s" repeatCount="indefinite" />
      </rect>
      
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" begin="3.125s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="225" to="585" dur="5s" repeatCount="indefinite" />
      </rect>
      
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" begin="3.75s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="5s" repeatCount="indefinite" />
      </rect>
      
      <rect x="-6" y="-6" width="12" height="12" fill="url(#mainGradient)">
        <animateMotion dur="5s" begin="4.375s" repeatCount="indefinite" path="M150,150 m-75,0 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0" />
        <animateTransform attributeName="transform" type="rotate" from="315" to="675" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>
    
    <!-- Burst rays -->
    <g class="burst-rays">
      <path d="M150,150 l-45,-90" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
      </path>
      <path d="M150,150 l45,-90" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.25s" repeatCount="indefinite" />
      </path>
      <path d="M150,150 l90,-45" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite" />
      </path>
      <path d="M150,150 l90,45" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.75s" repeatCount="indefinite" />
      </path>
      <path d="M150,150 l45,90" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite" />
      </path>
      <path d="M150,150 l-45,90" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.25s" repeatCount="indefinite" />
      </path>
      <path d="M150,150 l-90,45" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s" repeatCount="indefinite" />
      </path>
      <path d="M150,150 l-90,-45" stroke="url(#mainGradient)" stroke-width="3" fill="none">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.75s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
  
  <!-- Text "SHORT BOOM" -->
  <g class="logo-text">
    <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="url(#mainGradient)" filter="url(#glow)">
      SHORT BOOM
      <animate attributeName="font-size" values="24;26;24" dur="2s" repeatCount="indefinite" />
    </text>
  </g>
</svg>